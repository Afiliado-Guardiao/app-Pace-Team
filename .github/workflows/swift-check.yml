# Confere se o Swift do Pace Buddy compila (app, widget e cartão) antes de
# gastar um build da Expo. Roda quando algo é enviado para o ramo
# ci/swift-check (ou manualmente).
name: Swift check
on:
  push:
    branches: [ci/swift-check]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Typecheck
        working-directory: base-app
        run: bash scripts/swift-typecheck.sh
  # Monta o projeto do iPhone de verdade (prebuild + Xcode, sem assinar) para
  # pegar erro de configuração dos alvos (app, widget e cartão do Buddy).
  build:
    # needs: typecheck
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: base-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
      - name: Alvos do projeto
        run: |
          xcodebuild -list -workspace ios/*.xcworkspace
          ls targets/buddy-intents targets/buddy-intents/shared
      - name: Compilar (simulador, sem assinatura)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "::notice::workspace=$WS scheme=$SCHEME"
          xcodebuild build -workspace "$WS" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > /tmp/xcodebuild.log 2>&1 || true
          tail -40 /tmp/xcodebuild.log
          # Cada linha com "error" vira uma anotação (dá para ler sem login)
          grep -E "error:|\\*\\* BUILD FAILED|Command .* failed" /tmp/xcodebuild.log | sort -u \
            | sed -E "s#$GITHUB_WORKSPACE/##g" | head -45 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log
