# Build do iPhone no Mac grátis do GitHub (não gasta o limite de builds da
# Expo) e envio para o TestFlight. Usa os mesmos certificados guardados na
# Expo. Roda quando algo é enviado para o ramo ci/ios-build (ou manualmente).
#
# Segredos do repositório (Settings › Secrets and variables › Actions),
# colados pelo dono do app:
#   EXPO_TOKEN     chave de acesso da Expo (conta paceteam-app)
#   ASC_KEY_ID     ID da chave da App Store Connect
#   ASC_ISSUER_ID  Issuer ID da App Store Connect
#   ASC_KEY_P8     conteúdo do arquivo AuthKey_XXXX.p8
name: iOS build (TestFlight)
on:
  push:
    branches: [ci/ios-build]
  workflow_dispatch:
concurrency:
  group: ios-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: base-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Conferir os segredos
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$EXPO_TOKEN" ] || missing="$missing EXPO_TOKEN"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Faltam os segredos:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base-app/package-lock.json
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Dependências
        run: |
          npm ci --no-audit --no-fund
          npm install -g eas-cli@latest
      - name: Build (no Mac do GitHub, com os certificados da Expo)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Com a chave da App Store Connect o EAS entra na Apple e liga sozinho
          # os recursos novos do app (ex.: Apple Saúde) no perfil de assinatura
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$EXPO_ASC_API_KEY_PATH"
          export EXPO_ASC_KEY_ID="$ASC_KEY_ID" EXPO_ASC_ISSUER_ID="$ASC_ISSUER_ID"
          export EXPO_APPLE_TEAM_ID=DD89586P8R EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
          eas build --platform ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/pace-team.ipa"
          ls -la "$RUNNER_TEMP/pace-team.ipa"
      - name: Enviar ao TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          node -e "
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas.json','utf8'));
          Object.assign(j.submit.production.ios,{ascApiKeyPath:process.env.KEY,ascApiKeyId:process.env.ASC_KEY_ID,ascApiKeyIssuerId:process.env.ASC_ISSUER_ID});
          fs.writeFileSync('eas.json',JSON.stringify(j,null,'\t')+'\n');"
          # 1º: direto do Mac para a Apple (altool), sem depender do envio da
          # Expo, que às vezes fica fora do ar. 2º: o envio da Expo, com limite
          # de 30 min por tentativa. Se tudo falhar, o fim da saída vira aviso
          # de erro, legível sem login.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ok=""
          for i in 1 2; do
            if xcrun altool --upload-app -f "$RUNNER_TEMP/pace-team.ipa" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee -a "$RUNNER_TEMP/submit.log"; [ "${PIPESTATUS[0]}" = 0 ]; then ok=1; break; fi
            echo "Envio direto $i falhou"; sleep 60
          done
          if [ -z "$ok" ]; then
            if perl -e 'alarm shift; exec @ARGV' 1800 eas submit --platform ios --profile production \
              --path "$RUNNER_TEMP/pace-team.ipa" --non-interactive 2>&1 | tee -a "$RUNNER_TEMP/submit.log"; [ "${PIPESTATUS[0]}" = 0 ]; then ok=1; fi
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          if [ -z "$ok" ]; then
            msg=$(tail -n 40 "$RUNNER_TEMP/submit.log" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Envio ao TestFlight::$msg"
            rm -f "$KEY"; exit 1
          fi
          rm -f "$KEY"
          git checkout -- eas.json
        shell: bash
      - name: Apagar o .ipa
        if: always()
        run: rm -f "$RUNNER_TEMP/pace-team.ipa" "$RUNNER_TEMP/AuthKey.p8"
