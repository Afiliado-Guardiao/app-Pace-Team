name: pushtime-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: pushtime-postgres-test
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=test"
      - "com.pushtime.managed=true"
      - "com.pushtime.service=database"
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pushtime_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_error_verbosity=default"
      - "-c"
      - "client_min_messages=error"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

networks:
  default:
    name: pushtime-test-network
