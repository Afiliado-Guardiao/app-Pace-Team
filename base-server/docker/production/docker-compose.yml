name: pushtime-production

services:
  api:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile
      args:
        - NODE_ENV=production
      labels:
        - "com.pushtime.project=pushtime"
        - "com.pushtime.environment=production"
        - "com.pushtime.managed=true"
        - "com.pushtime.type=image"
    container_name: pushtime-api-prod
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=production"
      - "com.pushtime.managed=true"
      - "com.pushtime.service=api"
    ports:
      - "127.0.0.1:${PRODUCTION_API_PORT}:${PRODUCTION_API_PORT}"
    env_file:
      - ../../.env
    environment:
      - HOST=0.0.0.0
      - PORT=${PRODUCTION_API_PORT}
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pushtime_prod
      - PRISMA_CLI_QUERY_ENGINE_TYPE=binary
      - PRISMA_CLIENT_ENGINE_TYPE=binary
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pushtime-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        compress: "true"
    command: >
      sh -c "
        while ! nc -z postgres 5432 2>/dev/null; do
          sleep 2
        done 2>/dev/null &&
        npx prisma migrate deploy 2>&1 | grep -E 'ERROR|Applied|No pending' || true &&
        node dist/server.js"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=100M
      - /app/.npm:mode=0755,size=50M

  postgres:
    image: postgres:16-alpine
    container_name: pushtime-postgres-prod
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=production"
      - "com.pushtime.managed=true"
      - "com.pushtime.service=database"
      - "com.pushtime.critical=true"
    ports:
      - "127.0.0.1:${PRODUCTION_POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pushtime_prod
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data/pgdata
    networks:
      - pushtime-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pushtime_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"
    shm_size: "256mb"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_error_verbosity=default"
      - "-c"
      - "client_min_messages=error"

networks:
  pushtime-prod-network:
    driver: bridge
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=production"
      - "com.pushtime.managed=true"

volumes:
  postgres_prod_data:
    name: pushtime_postgres_prod_data
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=production"
      - "com.pushtime.managed=true"
      - "com.pushtime.critical=true"
      - "com.pushtime.data-type=database"
