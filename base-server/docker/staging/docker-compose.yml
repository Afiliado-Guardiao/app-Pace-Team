name: pushtime-staging

services:
  api:
    build:
      context: ../../
      dockerfile: docker/staging/Dockerfile
      labels:
        - "com.pushtime.project=pushtime"
        - "com.pushtime.environment=staging"
        - "com.pushtime.managed=true"
        - "com.pushtime.type=image"
    container_name: pushtime-api-staging
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=staging"
      - "com.pushtime.managed=true"
      - "com.pushtime.service=api"
    ports:
      - "${STAGING_API_PORT}:${STAGING_API_PORT}"
    env_file:
      - ../../.env
    environment:
      - HOST=0.0.0.0
      - PORT=${STAGING_API_PORT}
      - NODE_ENV=staging
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pushtime_staging
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pushtime-staging-network
    volumes:
      - ../../:/app
      - /app/node_modules
    command: >
      sh -c "
        while ! nc -z postgres 5432 2>/dev/null; do
          sleep 1
        done 2>/dev/null &&
        npx prisma migrate deploy 2>&1 | grep -E 'ERROR|Applied|No pending' || true &&
        npx prisma generate 2>&1 | grep -E 'ERROR|Generated' || true &&
        npm run dev"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pushtime-postgres-staging
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=staging"
      - "com.pushtime.managed=true"
      - "com.pushtime.service=database"
    ports:
      - "${STAGING_POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pushtime_staging
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - pushtime-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_error_verbosity=default"
      - "-c"
      - "client_min_messages=error"
    restart: unless-stopped

networks:
  pushtime-staging-network:
    driver: bridge
    labels:
      - "com.pushtime.project=pushtime"
      - "com.pushtime.environment=staging"
      - "com.pushtime.managed=true"
