name: Staging Deploy

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projects/pushtime/staging

            # Descartar alterações locais
            echo "📥 Descartando alterações locais..."
            git reset --hard
            git clean -fd

            # Pull latest changes
            echo "📥 Atualizando código..."
            git pull origin staging

            # Install dependencies
            echo "📦 Instalando dependências..."
            npm ci --prefer-offline

            # Deploy with automated health checks and rollback
            echo "🚀 Executando deploy com health checks e rollback automático..."
            NODE_ENV=staging npm run docker:deploy --verbose

            echo "✅ Deployment completed successfully!"
