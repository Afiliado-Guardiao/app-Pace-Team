<h2>Redefinir a sua senha do PACE TEAM</h2>
<p>Recebemos um pedido para trocar a senha da sua conta.</p>
<p>Digite este código no app, na tela "Esqueci minha senha":</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
<p>O código vale por 1 hora. Se não foi você que pediu, pode ignorar este e-mail: a sua senha continua a mesma.</p>
<p>Equipe PACE TEAM</p>
