# Configuracao do projeto Supabase local (CLI).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# Os blocos [auth] abaixo valem para o ambiente LOCAL (`supabase start`).
# Para o projeto HOSPEDADO, os mesmos ajustes ficam no Dashboard
# (Authentication -> Providers / Sign In / Email) — veja o README.

project_id = "base-supabase"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Caixa de e-mail local — confira e-mails de teste em http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Onboarding pre-cadastro usa login anonimo — precisa estar ligado.
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Cadastro instantaneo (sem confirmar e-mail), igual a UX atual do template.
# Em PRODUCAO, troque para `true` e ajuste o mesmo no Dashboard.
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Login social — preencha client_id / secret e mude `enabled = true` para ativar.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true
policy = "oneshot"

# Webhook do Paywallo: rota publica, sem verificacao de JWT.
[functions.paywallo-webhook]
verify_jwt = false

[analytics]
enabled = false
